schema_version: event_actor_motif_registry_v1_2026_05_28
status: diagnostic_design_registry
scope: >
  Defines event-state and actor-motif structures for Phase3Z46 reward dry
  audit. This registry does not promote any event/limit alpha or modify
  X0/R3, G2, J2/J4, or Phase3P.

global_rules:
  official_x0_r3: read_only
  no_same_day_limit_status_for_after_open: true
  required_feature_lag_for_close_touch_break_high_board: 1
  open_print_fields_after_open_only: true
  event_count_floor:
    diagnostic_only: "<20"
    research_candidate: "20-49"
    event_proof_candidate: ">=50"
  required_tests:
    - event_count
    - same_count_random_placebo
    - matched_control
    - tradability_failure_rate
    - top_day_contribution
    - r3_marginal_overlay_check

actor_motifs:
  high_board_continuation:
    actor_motif: high_board_chaser_continuation
    mechanism: "chasing funds continue to crowd into market leaders"
    trigger:
      - limit_up_streak_ge_n
      - is_market_high_board
      - market_high_board_ge_n
    event_age: [1, 2, 3, 5]
    context:
      - limit_density_high
      - liquidity_low
      - trend_low
    roles: [challenger, event_module, intensifier]
    expected_horizon: [1, 3]
    availability: after_close_T_plus_1
    tradability_requirement: entry_limit_mask_required
    matched_control_key: same_industry_same_size_same_limit_density

  high_board_break_unwind:
    actor_motif: high_board_chaser_unwind
    mechanism: "failed board releases crowded high-board positioning"
    trigger:
      - limit_up_streak_ge_n
      - limit_up_touch_not_close
      - break_board_after_streak_ge_n
      - break_after_high_board_tplus_n
    event_age: [1, 2, 3]
    context:
      - R3_liquidity_low
      - limit_density_low
      - breadth_low
    roles: [event_module, veto, intensifier]
    expected_horizon: [1, 3]
    availability: after_close_T_plus_1
    tradability_requirement: avoid_unfillable_limit_open
    matched_control_key: same_streak_length_no_break_board

  open_locked_then_break:
    actor_motif: open_board_liquidity_failure
    mechanism: "limit-open chasing demand fails before close"
    trigger:
      - limit_up_open_event
      - limit_up_open_not_close
    event_age: [0, 1, 2]
    context:
      - R3_liquidity_low
      - amount_exhaustion
      - limit_density_not_high
    roles: [event_module, veto]
    expected_horizon: [1]
    availability: after_close_T_plus_1
    tradability_requirement: open_print_not_enough_for_same_day_fill_claim
    matched_control_key: same_open_limit_no_break

  touch_not_close_reversal:
    actor_motif: intraday_touch_exhaustion
    mechanism: "intraday limit touch without close lock signals exhausted chase demand"
    trigger:
      - limit_up_touch_event
      - limit_up_touch_not_close
    event_age: [1, 2, 3]
    context:
      - liquidity_low
      - high_turnover
      - breadth_low
    roles: [event_module, challenger, veto]
    expected_horizon: [1, 3]
    availability: after_close_T_plus_1
    tradability_requirement: intraday_touch_not_assumed_fillable
    matched_control_key: same_touch_intensity_close_locked_control

  limit_down_rebound:
    actor_motif: distressed_liquidity_rebound
    mechanism: "forced selling pressure relaxes after limit-down sequences"
    trigger:
      - limit_down_streak_ge_n
      - limit_down_rebound_after_streak_ge_n
    event_age: [1, 2, 3]
    context:
      - liquidity_low
      - volatility_high
      - limit_density_high
    roles: [event_module, challenger]
    expected_horizon: [1, 3, 5]
    availability: after_close_T_plus_1
    tradability_requirement: sell_side_limit_down_nonfill_audit
    matched_control_key: same_down_streak_no_rebound

  market_limit_density_veto:
    actor_motif: market_event_crowding_state
    mechanism: "market-wide limit density changes whether X0/R3 should be intensified or de-risked"
    trigger:
      - market_limit_density_high
      - market_limit_density_low
      - R3_liquidity_low
    event_age: [0, 1]
    context:
      - R3_liquidity_low
      - breadth_low
      - volatility_high
    roles: [veto, intensifier]
    expected_horizon: [1]
    availability: lagged_regime_state
    tradability_requirement: gate_only_not_single_name_signal
    matched_control_key: same_active_ratio_random_gate
